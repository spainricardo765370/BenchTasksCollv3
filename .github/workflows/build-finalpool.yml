name: Build finalpool

on:
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout task sources
        uses: actions/checkout@v4
        with:
          ref: finalpool-build
          fetch-depth: 0
      - name: Build and publish finalpool
        run: python3 .github/scripts/build_finalpool.py
