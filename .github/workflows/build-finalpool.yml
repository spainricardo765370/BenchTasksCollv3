name: Build finalpool

on:
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
      - name: Remove temporary build helpers
        run: |
          set -euo pipefail
          git config user.name "finalpool-bot"
          git config user.email "finalpool-bot@users.noreply.github.com"
          test -n "$(git ls-remote --heads origin refs/heads/finalpool)"
          if git ls-remote --exit-code --heads origin refs/heads/finalpool-build >/dev/null; then
            git push origin --delete refs/heads/finalpool-build
          fi
          git rm --quiet .github/workflows/build-finalpool.yml
          git commit --quiet -m "Remove temporary finalpool build workflow"
          git push origin HEAD:main
          git ls-remote --heads origin refs/heads/finalpool refs/heads/main
